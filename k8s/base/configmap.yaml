apiVersion: v1
kind: ConfigMap
metadata:
  name: wilcam-config
  namespace: wilcam
data:
  NODE_ENV: "production"
  PORT: "3000"
  CORS_ORIGIN: "https://wilcam.example.com"
  AWS_REGION: "us-east-1"
  ENABLE_AI: "true"
  ENABLE_WEBRTC: "false"
  AUTO_START_STREAMS: "false"
  AI_SERVICE_URL: "http://wilcam-ai:8000"
  REDIS_URL: "redis://wilcam-redis:6379"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: wilcam-ai-config
  namespace: wilcam
data:
  DEVICE: "cpu"
  CONFIDENCE_THRESHOLD: "0.5"
  IOU_THRESHOLD: "0.45"
  MAX_IMAGE_SIZE: "640"
  REDIS_URL: "redis://wilcam-redis:6379"
