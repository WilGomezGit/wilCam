apiVersion: apps/v1
kind: Deployment
metadata:
  name: wilcam-redis
  namespace: wilcam
  labels:
    app: wilcam-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wilcam-redis
  template:
    metadata:
      labels:
        app: wilcam-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
          ports:
            - containerPort: 6379
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "320Mi"
              cpu: "200m"
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: redis-data
              mountPath: /data
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: redis-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: wilcam-redis
  namespace: wilcam
spec:
  selector:
    app: wilcam-redis
  ports:
    - port: 6379
      targetPort: 6379
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-pvc
  namespace: wilcam
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
