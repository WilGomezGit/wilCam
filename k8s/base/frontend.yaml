apiVersion: apps/v1
kind: Deployment
metadata:
  name: wilcam-frontend
  namespace: wilcam
  labels:
    app: wilcam-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: wilcam-frontend
  template:
    metadata:
      labels:
        app: wilcam-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/wilgomezgit/wilcam-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: wilcam-frontend
  namespace: wilcam
spec:
  selector:
    app: wilcam-frontend
  ports:
    - port: 80
      targetPort: 80
