apiVersion: apps/v1
kind: Deployment
metadata:
  name: wilcam-backend
  namespace: wilcam
  labels:
    app: wilcam-backend
    version: v2
spec:
  replicas: 2
  selector:
    matchLabels:
      app: wilcam-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: wilcam-backend
        version: v2
    spec:
      containers:
        - name: backend
          image: ghcr.io/wilgomezgit/wilcam-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: wilcam-config
            - secretRef:
                name: wilcam-secrets
          env:
            - name: DB_PATH
              value: /data/wilcam.db
            - name: HLS_OUTPUT_DIR
              value: /data/hls
            - name: RECORDINGS_DIR
              value: /data/recordings
            - name: SNAPSHOTS_DIR
              value: /data/snapshots
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 5
          volumeMounts:
            - name: wilcam-data
              mountPath: /data
      volumes:
        - name: wilcam-data
          persistentVolumeClaim:
            claimName: wilcam-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: wilcam-backend
  namespace: wilcam
spec:
  selector:
    app: wilcam-backend
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wilcam-data-pvc
  namespace: wilcam
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 50Gi
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: wilcam-backend-hpa
  namespace: wilcam
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: wilcam-backend
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
