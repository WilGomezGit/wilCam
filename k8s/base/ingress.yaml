apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wilcam-ingress
  namespace: wilcam
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    # WebSocket support for Socket.IO
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - wilcam.example.com
      secretName: wilcam-tls
  rules:
    - host: wilcam.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: wilcam-backend
                port:
                  number: 3000
          - path: /hls
            pathType: Prefix
            backend:
              service:
                name: wilcam-backend
                port:
                  number: 3000
          - path: /snapshots
            pathType: Prefix
            backend:
              service:
                name: wilcam-backend
                port:
                  number: 3000
          - path: /recordings
            pathType: Prefix
            backend:
              service:
                name: wilcam-backend
                port:
                  number: 3000
          - path: /socket.io
            pathType: Prefix
            backend:
              service:
                name: wilcam-backend
                port:
                  number: 3000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wilcam-frontend
                port:
                  number: 80
