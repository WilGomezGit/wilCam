name: wilcam
description: WilCam — AI Cloud Video Surveillance
version: 2.0.0+1
publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^13.2.4

  # Network
  dio: ^5.4.3+1
  socket_io_client: ^2.0.3+1
  web_socket_channel: ^2.4.5

  # Video
  flutter_vlc_player: ^7.4.1
  video_player: ^2.8.6
  chewie: ^1.8.1

  # Push notifications
  firebase_core: ^2.30.0
  firebase_messaging: ^14.9.0
  flutter_local_notifications: ^17.1.2

  # Auth & Security
  flutter_secure_storage: ^9.0.0
  local_auth: ^2.2.0

  # UI
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  fl_chart: ^0.68.0
  lottie: ^3.1.0
  intl: ^0.19.0
  timeago: ^3.6.1

  # Utils
  shared_preferences: ^2.2.3
  connectivity_plus: ^6.0.4
  permission_handler: ^11.3.1
  image_picker: ^1.1.1
  path_provider: ^2.1.3
  package_info_plus: ^8.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  riverpod_generator: ^2.4.0
  build_runner: ^2.4.9
  json_annotation: ^4.9.0
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
  fonts:
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Regular.ttf
        - asset: assets/fonts/SpaceGrotesk-Medium.ttf
          weight: 500
        - asset: assets/fonts/SpaceGrotesk-Bold.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
